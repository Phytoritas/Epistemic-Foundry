interface:
  display_name: "Epistemic Foundry"
  short_description: "Coverage-first, evidence-gated research workflow"
  icon_small: "../../../assets/composer-icon.svg"
  icon_large: "../../../assets/logo.svg"
  brand_color: "#3F4B5B"
  default_prompt: "Frame this research claim with FORGE and preserve counterevidence."
policy:
  invocation_disposition: PARENT_ROUTER
  allow_implicit_invocation: true
  sensitive: false
  side_effecting: false
  load_full_instructions: on_demand
  routing_only: true
activation:
  should_trigger:
    - "claim validation"
    - "contradiction analysis"
    - "evidence coverage"
    - "evidence synthesis"
    - "hypothesis passport"
    - "literature synthesis"
  should_not_trigger:
    - "casual question"
    - "ordinary editing"
    - "proofread"
    - "rewrite"
    - "translate"
