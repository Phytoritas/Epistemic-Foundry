[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "epistemic-foundry"
version = "4.0.0"
description = "Epistemic Foundry v4 — evolution-governed hypothesis validation kernel"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23,<5",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9"]

[project.scripts]
efoundry = "epistemic_foundry.cli.main:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-dir]
"" = "src"
"scripts.build.canonical_registry" = "scripts/build/canonical_registry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
epistemic_foundry = [
    "_canonical/canonical-registry.json",
    "_canonical/schemas/*.schema.json",
    "_canonical/openapi/*.yaml",
]

[tool.setuptools.cmdclass]
build_py = "scripts.build.canonical_registry.build_hooks.CanonicalBuildPy"
sdist = "scripts.build.canonical_registry.build_hooks.CanonicalSdist"

[tool.epistemic-foundry.workspace]
node_root = "packages"
python_runtime_root = "src/epistemic_foundry"
python_component_root = "python/epistemic_foundry"
component_source_imports = "forbidden"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[dependency-groups]
skill-context = [
    "tiktoken==0.13.0",
]
