  read_scope: []
  write_scope:
  - artifacts/verifier/challenges/**
  capabilities:
  - artifact_read
  - artifact_write
  - llm_inference
  model_tier: frontier
  timeout_seconds: 1200
  max_attempts: 2
  failure_policy: fail_run
  acceptance_checks:
  - generate_adversarial_evaluator_challenges contract valid
  - generate_adversarial_evaluator_challenges result receipt present
  resource_dependencies: []
  determinism_class: provider_nondeterministic
  idempotency_key_fields:
