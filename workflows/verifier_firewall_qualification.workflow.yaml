  - capability_scope_valid
- node_id: execute_evaluator_test_matrix
  purpose: Execute baseline, metamorphic, adversarial, calibration and crash tests
  executor_type: sandbox
  executor_ref: epistemic_foundry.evolution.execute_evaluator_test_matrix:run
  input_schema_ref: schemas/node-invocation.schema.json
  output_schema_ref: schemas/stage-evaluation-result.schema.json
  depends_on:
  - run_leakage_audit
  - generate_metamorphic_suite
  - generate_adversarial_evaluator_challenges
  read_scope: []
  write_scope:
  - artifacts/verifier/test_results/**
  capabilities:
  - artifact_read
  - artifact_write
  - sandbox_execute
  model_tier: balanced
  timeout_seconds: 1200
  max_attempts: 2
  failure_policy: fail_run
  acceptance_checks:
  - execute_evaluator_test_matrix contract valid
  - execute_evaluator_test_matrix result receipt present
