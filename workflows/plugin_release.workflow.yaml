  - reports/216_lens_plugin_audit_results.json
  - artifacts/release/**
  write_scope:
  - artifacts/release/216_lens/**
  capabilities:
  - filesystem_read
  - artifact_read
  - artifact_write
  model_tier: deterministic
  timeout_seconds: 300
  max_attempts: 2
  failure_policy: fail_run
  acceptance_checks:
  - 216 lenses accounted
  - zero FAIL at spec release
  - conditional owners explicit
  resource_dependencies: []
  determinism_class: deterministic
  idempotency_key_fields:
