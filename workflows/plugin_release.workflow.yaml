  executor_type: policy
  executor_ref: epistemic_foundry.plugin.apply_release_gate:run
  input_schema_ref: schemas/node-invocation.schema.json
  output_schema_ref: schemas/result-envelope.schema.json
  depends_on:
  - independent_release_review
  read_scope:
  - artifacts/release/**
  - manifests/acceptance_matrix.yaml
  write_scope:
