- node_id: independent_release_review
  purpose: Review spec, code, tests, compatibility, security, conditional items and
    capability claims
  executor_type: llm
  executor_ref: prompts/plugin/independent_release_review.md
  input_schema_ref: schemas/node-invocation.schema.json
  output_schema_ref: schemas/result-envelope.schema.json
  depends_on:
  - run_216_lens_plugin_audit
  - generate_openapi_clients_and_contract_tests
  - run_performance_budget_tests
  - sign_release_artifacts
  read_scope:
  - artifacts/release/**
  - dist/**
  - docs/**
  write_scope:
  - artifacts/release/independent_review/**
  capabilities:
  - artifact_read
  - filesystem_read
  - artifact_write
  model_tier: frontier
  timeout_seconds: 300
  max_attempts: 2
  failure_policy: fail_run
  acceptance_checks:
  - reviewer did not author release
  - capability claims source-backed
  - conditional items block inappropriate level
  resource_dependencies: []
  determinism_class: provider_nondeterministic
  idempotency_key_fields:
  - run_id
  - node_id
  - input_hash
  loop_contract_ref: null
  expected_effects: []
  required_policy_checks:
  - policy_bundle_valid
  - capability_scope_valid
- node_id: apply_release_gate
