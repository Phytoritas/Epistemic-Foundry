  purpose: Generate SBOM, license report, source/bundle/environment hashes and provenance
  executor_type: deterministic
  executor_ref: epistemic_foundry.plugin.generate_sbom_and_provenance:run
  input_schema_ref: schemas/node-invocation.schema.json
  output_schema_ref: schemas/result-envelope.schema.json
  depends_on:
