  executor_type: sandbox
  executor_ref: epistemic_foundry.plugin.run_performance_budget_tests:run
  input_schema_ref: schemas/node-invocation.schema.json
  output_schema_ref: schemas/result-envelope.schema.json
  depends_on:
  - build_reproducible_distribution
  read_scope:
  - dist/**
  - tests/performance/**
  write_scope:
  - artifacts/release/performance/**
  capabilities:
  - sandbox_execute
  - artifact_write
  model_tier: deterministic
  timeout_seconds: 7200
  max_attempts: 2
  failure_policy: fail_run
  acceptance_checks:
  - hook latency SLO measured
  - fan-in missing detection 100%
  - budget enforcement class truthful
  resource_dependencies: []
  determinism_class: seeded_nondeterministic
  idempotency_key_fields:
  - run_id
  - node_id
  - input_hash
  loop_contract_ref: null
  expected_effects: []
  required_policy_checks:
  - policy_bundle_valid
  - capability_scope_valid
- node_id: run_216_lens_plugin_audit
  purpose: Execute the structured 216-lens plugin architecture and release audit
  executor_type: policy
  executor_ref: epistemic_foundry.plugin.run_216_lens_plugin_audit:run
  input_schema_ref: schemas/node-invocation.schema.json
