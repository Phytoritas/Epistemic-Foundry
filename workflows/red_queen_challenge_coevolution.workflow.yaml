workflow_id: red_queen_challenge_coevolution
version: 4.0.0
kind: dag
description: Co-evolve a diverse falsifier population against hypotheses without turning
  attacks into authority.
input_schema_ref: schemas/node-invocation.schema.json
output_schema_ref: schemas/result-envelope.schema.json
canonical_runtime: Foundry Kernel
state_authority: Noetic Ledger
invariants:
- challenge success must reproduce and remain relevant to the claim
- hidden holdout remains inaccessible
- boundary discoveries are preserved instead of mislabeled as total refutations
- challenge population is itself audited for overfitting
terminal_states:
- PASS
- PARTIAL
- BLOCKED
- SPEC_GAP
- FAIL
completeness_contract:
  expected_node_count_source: compiled_run_spec
  missing_node_policy: FAIL
  partial_result_policy: typed_and_visible_only
nodes:
- node_id: load_hypothesis_and_challenge_archives
  purpose: Load typed public candidate views and prior challenge outcomes
  executor_type: deterministic
  executor_ref: epistemic_foundry.evolution.load_hypothesis_and_challenge_archives:run
  input_schema_ref: schemas/node-invocation.schema.json
  output_schema_ref: schemas/red-queen-round.schema.json
  depends_on: []
  read_scope: []
  write_scope:
  - artifacts/red_queen/input/**
  capabilities:
  - artifact_read
  - artifact_write
  model_tier: deterministic
  timeout_seconds: 1200
  max_attempts: 2
  failure_policy: fail_run
  acceptance_checks:
  - load_hypothesis_and_challenge_archives contract valid
  - load_hypothesis_and_challenge_archives result receipt present
  resource_dependencies: []
  determinism_class: deterministic
  idempotency_key_fields:
  - run_id
  - node_id
  - input_hash
  loop_contract_ref: null
  expected_effects:
  - load_hypothesis_and_challenge_archives_completed
  required_policy_checks:
  - policy_bundle_valid
  - capability_scope_valid
- node_id: measure_challenge_coverage
  purpose: Map uncovered failure surfaces and overused challenge families
  executor_type: deterministic
  executor_ref: epistemic_foundry.evolution.measure_challenge_coverage:run
  input_schema_ref: schemas/node-invocation.schema.json
  output_schema_ref: schemas/quality-diversity-map.schema.json
  depends_on:
  - load_hypothesis_and_challenge_archives
  read_scope: []
  write_scope:
  - artifacts/red_queen/coverage/**
  capabilities:
  - artifact_read
  - artifact_write
  model_tier: deterministic
  timeout_seconds: 1200
  max_attempts: 2
  failure_policy: fail_run
  acceptance_checks:
  - measure_challenge_coverage contract valid
  - measure_challenge_coverage result receipt present
  resource_dependencies: []
  determinism_class: deterministic
  idempotency_key_fields:
  - run_id
  - node_id
  - input_hash
  loop_contract_ref: null
  expected_effects:
  - measure_challenge_coverage_completed
  required_policy_checks:
  - policy_bundle_valid
  - capability_scope_valid
- node_id: select_challenge_parents
  purpose: Select challenge parents by failure-surface coverage, reproducibility and
    nonredundancy
  executor_type: llm
  executor_ref: prompts/parent_selector.md
  input_schema_ref: schemas/node-invocation.schema.json
  output_schema_ref: schemas/parent-selection-receipt.schema.json
  depends_on:
  - measure_challenge_coverage
  read_scope: []
  write_scope:
  - artifacts/red_queen/selection/**
  capabilities:
  - artifact_read
  - artifact_write
  - llm_inference
  model_tier: frontier
  timeout_seconds: 1200
  max_attempts: 2
  failure_policy: fail_run
  acceptance_checks:
  - select_challenge_parents contract valid
  - select_challenge_parents result receipt present
  resource_dependencies: []
  determinism_class: provider_nondeterministic
  idempotency_key_fields:
  - run_id
  - node_id
  - input_hash
  loop_contract_ref: null
  expected_effects:
  - select_challenge_parents_completed
  required_policy_checks:
  - policy_bundle_valid
  - capability_scope_valid
- node_id: mutate_counterexample_challenges
  purpose: Generate candidate counterexamples and null models
  executor_type: llm
  executor_ref: prompts/red_queen_challenger.md
  input_schema_ref: schemas/node-invocation.schema.json
  output_schema_ref: schemas/challenge-genome.schema.json
  depends_on:
