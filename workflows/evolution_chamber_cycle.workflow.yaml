workflow_id: evolution_chamber_cycle
version: 4.0.0
kind: dag
description: Run one governed quality-diversity hypothesis evolution cycle under immutable
  evaluators and evidence gates.
input_schema_ref: schemas/node-invocation.schema.json
output_schema_ref: schemas/result-envelope.schema.json
canonical_runtime: Foundry Kernel
state_authority: Noetic Ledger
invariants:
- evolution proposes and ranks but never owns promotion authority
- candidate-visible context excludes hidden holdout and evaluator secrets
- single scalar fitness cannot authorize promotion
- negative, null, failed replication and minority lineages remain retainable
- every generated, evaluated, selected and promoted candidate is lineage- and receipt-bound
terminal_states:
- PASS
- PARTIAL
- BLOCKED
- SPEC_GAP
- FAIL
completeness_contract:
  expected_node_count_source: compiled_run_spec
  missing_node_policy: FAIL
  partial_result_policy: typed_and_visible_only
nodes:
- node_id: qualify_evolution_run
  purpose: Validate immutable EvolutionRunSpec, authority, candidate classes, budget
    and stop rules
  executor_type: policy
  executor_ref: epistemic_foundry.evolution.qualify_evolution_run:run
  input_schema_ref: schemas/node-invocation.schema.json
  output_schema_ref: schemas/evolution-run-spec.schema.json
  depends_on: []
  read_scope: []
  write_scope:
  - db.evolution_runs
  capabilities:
  - artifact_read
  - artifact_write
  model_tier: deterministic
  timeout_seconds: 1200
  max_attempts: 2
  failure_policy: fail_run
  acceptance_checks:
  - run spec hash verified
  - evaluator authority excluded from candidate mutation
  resource_dependencies: []
  determinism_class: deterministic
  idempotency_key_fields:
  - run_id
  - node_id
  - input_hash
  loop_contract_ref: null
  expected_effects:
  - qualify_evolution_run_completed
  required_policy_checks:
  - policy_bundle_valid
  - capability_scope_valid
- node_id: seal_evaluator_bundle
  purpose: Resolve and seal the immutable evaluator, holdout and policy bundle for
    this run
  executor_type: policy
  executor_ref: epistemic_foundry.evolution.seal_evaluator_bundle:run
  input_schema_ref: schemas/node-invocation.schema.json
  output_schema_ref: schemas/evaluator-bundle.schema.json
  depends_on:
