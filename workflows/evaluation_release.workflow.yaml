workflow_id: evaluation_release
version: 4.0.0
kind: dag
description: Run specification, plugin compatibility, scientific, security, calibration,
  recovery, cross-provider, and scale checks before a signed Epistemic Foundry release
  manifest.
input_schema_ref: schemas/node-invocation.schema.json
output_schema_ref: schemas/result-envelope.schema.json
canonical_runtime: Foundry Kernel
state_authority: Noetic Ledger
invariants:
- specification validation, scientific evaluation, security review, calibration, and
  release provenance are independent gates
- evaluation snapshots are frozen before scoring
- known-false, adversarial, contradiction, and time-sliced cases are mandatory
- release evidence includes failures and conditional environment decisions
- build provenance and package hashes are generated after validation
terminal_states:
- PASS
- PARTIAL
- BLOCKED
- SPEC_GAP
- FAIL
completeness_contract:
  expected_node_count_source: compiled_run_spec
  missing_node_policy: FAIL
  partial_result_policy: typed_and_visible_only
nodes:
- node_id: freeze_evaluation_snapshot
  purpose: Freeze schemas, prompts, workflows, policies, corpus/eval fixtures, model
    identifiers, and seeds
  executor_type: deterministic
  executor_ref: epistemic_foundry.evaluation.snapshot:freeze
  input_schema_ref: schemas/node-invocation.schema.json
  output_schema_ref: schemas/result-envelope.schema.json
  depends_on: []
  read_scope:
  - schemas/**
  - prompts/**
  - workflows/**
  - manifests/**
  - eval/**
  - config/**
  write_scope:
  - artifacts/evaluation/snapshot/**
  capabilities:
  - filesystem_read
  - artifact_write
  model_tier: deterministic
  timeout_seconds: 900
  max_attempts: 1
  failure_policy: fail_run
  acceptance_checks:
  - snapshot hash covers all inputs
  - holdout labels sealed
  - timestamp and builder identity recorded
  resource_dependencies: []
  determinism_class: deterministic
  idempotency_key_fields:
  - run_id
  - node_id
  - input_hash
  loop_contract_ref: null
  expected_effects:
  - evaluation_snapshot_created
  required_policy_checks:
  - policy_bundle_valid
  - capability_scope_valid
- node_id: validate_schema_bundle
  purpose: Meta-validate schemas, examples, migrations, strictness, and round-trip
    contracts
  executor_type: deterministic
  executor_ref: epistemic_foundry.evaluation.schemas:validate
  input_schema_ref: schemas/node-invocation.schema.json
  output_schema_ref: schemas/result-envelope.schema.json
  depends_on:
  - freeze_evaluation_snapshot
  read_scope:
  - artifacts/evaluation/snapshot/**
  write_scope:
  - artifacts/evaluation/schema_validation/**
  capabilities:
  - artifact_read
  - filesystem_read
  - artifact_write
  - python_analysis
  model_tier: deterministic
  timeout_seconds: 14400
  max_attempts: 1
  failure_policy: fail_run
  acceptance_checks:
  - command and exit code captured
  - metric denominators recorded
  - failures retained
  resource_dependencies:
  - quota:evaluation:schema_validation
  determinism_class: deterministic
  idempotency_key_fields:
  - run_id
  - node_id
  - input_hash
  loop_contract_ref: null
  expected_effects:
  - schema_validation_created
  required_policy_checks:
