  capabilities:
  - artifact_read
  - artifact_write
  model_tier: deterministic
  timeout_seconds: 1200
  max_attempts: 2
  failure_policy: fail_run
  acceptance_checks:
  - validate_all_workflow_graphs contract valid
  - validate_all_workflow_graphs result receipt present
  resource_dependencies: []
  determinism_class: deterministic
  idempotency_key_fields:
