workflow_id: evolution_release
version: 4.0.0
kind: dag
description: Validate and package v4 specification and later implementation releases
  without maturity overclaim.
input_schema_ref: schemas/node-invocation.schema.json
output_schema_ref: schemas/result-envelope.schema.json
canonical_runtime: Foundry Kernel
state_authority: Noetic Ledger
invariants:
- specification validation is not implementation validation
- unsigned means unsigned
- all release counts derive from the package
- conditional external values remain visible
terminal_states:
- PASS
- PARTIAL
- BLOCKED
- SPEC_GAP
- FAIL
completeness_contract:
  expected_node_count_source: compiled_run_spec
  missing_node_policy: FAIL
  partial_result_policy: typed_and_visible_only
nodes:
- node_id: freeze_v4_release_candidate
  purpose: Freeze specification, schemas, workflows, prompts, skills and source inventory
  executor_type: deterministic
  executor_ref: epistemic_foundry.evolution.freeze_v4_release_candidate:run
  input_schema_ref: schemas/node-invocation.schema.json
  output_schema_ref: schemas/artifact-manifest.schema.json
  depends_on: []
  read_scope: []
  write_scope:
  - artifacts/release/frozen/**
  capabilities:
  - artifact_read
  - artifact_write
  model_tier: deterministic
  timeout_seconds: 1200
  max_attempts: 2
  failure_policy: fail_run
  acceptance_checks:
  - freeze_v4_release_candidate contract valid
  - freeze_v4_release_candidate result receipt present
  resource_dependencies: []
  determinism_class: deterministic
  idempotency_key_fields:
  - run_id
  - node_id
  - input_hash
  loop_contract_ref: null
  expected_effects:
  - freeze_v4_release_candidate_completed
  required_policy_checks:
  - policy_bundle_valid
  - capability_scope_valid
- node_id: validate_all_v4_schemas_examples
  purpose: Meta-validate all Draft 2020-12 schemas and matching examples
  executor_type: deterministic
  executor_ref: epistemic_foundry.evolution.validate_all_v4_schemas_examples:run
  input_schema_ref: schemas/node-invocation.schema.json
  output_schema_ref: schemas/evaluation-run.schema.json
  depends_on:
  - freeze_v4_release_candidate
  read_scope: []
  write_scope:
  - artifacts/release/schema_validation/**
  capabilities:
  - artifact_read
  - artifact_write
  model_tier: deterministic
  timeout_seconds: 1200
  max_attempts: 2
  failure_policy: fail_run
  acceptance_checks:
  - validate_all_v4_schemas_examples contract valid
  - validate_all_v4_schemas_examples result receipt present
  resource_dependencies: []
  determinism_class: deterministic
  idempotency_key_fields:
  - run_id
  - node_id
  - input_hash
  loop_contract_ref: null
  expected_effects:
  - validate_all_v4_schemas_examples_completed
  required_policy_checks:
  - policy_bundle_valid
  - capability_scope_valid
- node_id: validate_all_workflow_graphs
  purpose: Validate node contracts, references, DAGs, write conflicts and expected
    counts
  executor_type: deterministic
  executor_ref: epistemic_foundry.evolution.validate_all_workflow_graphs:run
  input_schema_ref: schemas/node-invocation.schema.json
  output_schema_ref: schemas/evaluation-run.schema.json
  depends_on:
