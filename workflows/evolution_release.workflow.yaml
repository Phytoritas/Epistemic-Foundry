  capabilities:
  - artifact_read
  - artifact_write
  model_tier: deterministic
  timeout_seconds: 1200
  max_attempts: 2
  failure_policy: fail_run
  acceptance_checks:
  - validate_a_to_z_work_graph contract valid
  - validate_a_to_z_work_graph result receipt present
  resource_dependencies: []
  determinism_class: deterministic
  idempotency_key_fields:
  - run_id
  - node_id
  - input_hash
  loop_contract_ref: null
  expected_effects:
