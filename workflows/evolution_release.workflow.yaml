  read_scope: []
  write_scope:
  - artifacts/release/security/**
  capabilities:
  - artifact_read
  - artifact_write
  - sandbox_execute
  model_tier: balanced
  timeout_seconds: 1200
  max_attempts: 2
  failure_policy: fail_run
  acceptance_checks:
  - run_evolution_threat_model_suite contract valid
  - run_evolution_threat_model_suite result receipt present
  resource_dependencies: []
  determinism_class: seeded_nondeterministic
  idempotency_key_fields:
