workflow_id: forge_research_cycle
version: 4.0.0
kind: dag
description: Execute the research-native FORGE lifecycle from classification to Passport.
input_schema_ref: schemas/node-invocation.schema.json
output_schema_ref: schemas/result-envelope.schema.json
canonical_runtime: Foundry Kernel
state_authority: Noetic Ledger
invariants:
- phase transitions require artifact receipts and expected revision
- human authority is explicit rather than a free pass
- Observe precedes verdict formation
- reasoning modes remain typed
- Parliament is asymmetric and majority cannot promote
- under-determination is a valid terminal result
terminal_states:
- PASS
- PARTIAL
- BLOCKED
- SPEC_GAP
- FAIL
completeness_contract:
  expected_node_count_source: compiled_run_spec
  missing_node_policy: FAIL
  partial_result_policy: typed_and_visible_only
nodes:
- node_id: classify_epistemic_work
  purpose: Deterministically classify the request E0-E5 from sealed typed signals and commit the canonical classification artifact
  executor_type: policy
  executor_ref: epistemic_foundry.forge.classifier:classify_epistemic_work
  input_schema_ref: schemas/node-invocation.schema.json
  output_schema_ref: schemas/epistemic-work-classification.schema.json
  depends_on: []
  read_scope:
  - request
  - policy/**
  - artifacts/work_classification/proposals/**
  write_scope:
  - artifacts/work_classification/**
  capabilities:
  - artifact_read
  - artifact_write
  model_tier: deterministic
  timeout_seconds: 300
  max_attempts: 2
  failure_policy: fail_run
  acceptance_checks:
  - closed signal vocabulary
  - deterministic maximum-floor rule
  - monotonic underprocessing guard
  - class-specific exact projection
  - direct EpistemicWorkClassification output
  - ArtifactReceipt exists
  - replay identity holds
  resource_dependencies: []
  determinism_class: deterministic
  idempotency_key_fields:
  - request_id
  - input_hash
  - classifier_version
  - policy_bundle_hash
  loop_contract_ref: null
  expected_effects: []
  required_policy_checks:
  - policy_bundle_valid
  - capability_scope_valid
- node_id: detect_interview_need
  purpose: Detect unresolved goal, scope, ontology, authority, consent or success
    criteria
  executor_type: llm
  executor_ref: prompts/plugin/detect_interview_need.md
  input_schema_ref: schemas/node-invocation.schema.json
  output_schema_ref: schemas/result-envelope.schema.json
  depends_on:
  - classify_epistemic_work
  read_scope:
  - request
  - artifacts/work_classification/**
  write_scope:
  - artifacts/interview_need/**
  capabilities:
  - artifact_read
  - artifact_write
  model_tier: balanced
  timeout_seconds: 300
  max_attempts: 2
  failure_policy: fail_run
  acceptance_checks:
  - critical ambiguities enumerated
  - previously known facts not re-asked
  - E5 ambiguity triggers Interview
  resource_dependencies: []
  determinism_class: provider_nondeterministic
  idempotency_key_fields:
  - run_id
  - node_id
  - input_hash
  loop_contract_ref: null
  expected_effects: []
  required_policy_checks:
  - policy_bundle_valid
  - capability_scope_valid
- node_id: conduct_bounded_interview
