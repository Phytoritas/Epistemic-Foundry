workflow_id: evidence_retrieval
version: 4.0.0
kind: dag
description: Compile an immutable class-bound QueryPlan, execute only selected evidence
  lanes, reconcile all eleven canonical lanes, and issue a scope-bounded certificate.
input_schema_ref: schemas/node-invocation.schema.json
output_schema_ref: schemas/result-envelope.schema.json
canonical_runtime: Foundry Kernel
state_authority: Noetic Ledger
invariants:
- vector similarity is never the sole retrieval channel
- RetrievalCandidate is the O02 business output and ResultEnvelope is telemetry only
- every backend request binds the QueryPlan, query batch, snapshot, index, policy, backend, and adapter versions
- raw backend responses are untrusted until receipt, request, provenance, rank, and content hashes validate
- lane-local exact deduplication precedes deterministic RRF k=60 fusion and candidate-id tie-breaking
- silent cross-channel fallback and learned reranking are forbidden
- metadata-only candidates cannot directly become EvidenceNode or promoted evidence
- the closed lane vocabulary and canonical order come from O01
- class-floor lanes are non-waivable and optional selection may only add protection
- support is an evidence role, not a retrieval lane
- selected lanes emit execution receipts and unselected lanes emit one UNSEARCHED sentinel
- searched-none is distinct from unsearched, blocked, partial, and failed
- absence and novelty claims are bounded by reconciled executed scope
- dependent evidence is deduplicated before ranking or counting
terminal_states:
- PASS
- PARTIAL
- BLOCKED
- SPEC_GAP
- FAIL
completeness_contract:
  expected_node_count_source: compiled_run_spec
  missing_node_policy: FAIL
  partial_result_policy: typed_and_visible_only
  lane_dispatch_policy: QueryPlan SELECTED dispositions only
  compiled_run_projection: omit unselected retrieval nodes and remove their dependency
    edges before execution
  fan_in_dependency_policy: emit_lane_receipts depends only on selected retrieval nodes
    in the compiled run; omitted lanes are reconciled from QueryPlan decisions
  unselected_lane_backend_calls: 0
  all_lane_reconciliation_count: 11
  e0_business_completion_state: NOT_REQUIRED
  selected_lane_state_precedence:
  - FAILED
  - BLOCKED
  - PARTIAL
  - SEARCHED_WITH_RESULTS
  - SEARCHED_NONE
retrieval_candidate_contract:
  business_output_schema_ref: schemas/retrieval-candidate.schema.json
  execution_envelope_schema_ref: schemas/result-envelope.schema.json
  result_envelope_role: telemetry_sidecar_only
  result_envelope_output_binding: output_artifact_ids
  provider_request_binding:
  - run_id
  - query_plan_id
  - plan_hash
  - lane
  - query_families
  - canonical_query_batch
  - query_hash
  - scope_filter
  - corpus_snapshot_hash
  - index_versions
  - max_candidates
  - cutoff_policy_id
  - deterministic_seed
  - policy_bundle_hash
  - capability_lease_id
  - backend_id
  - backend_version
  - adapter_id
  - adapter_version
  snapshot_mismatch_result: FAILED/integrity_failure/STALE_RETRIEVAL_SNAPSHOT
  silent_fallback_allowed: false
  non_vector_release_origins:
  - LEXICAL
  - CITATION_GRAPH
  - RELATION_GRAPH
  - EXTERNAL_INDEX
  candidate_self_hash_release_authority: false
  vector_only_run_ceiling: PARTIAL
nodes:
- node_id: validate_insight_readiness
