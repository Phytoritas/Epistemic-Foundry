    quotas into an immutable QueryPlan
  executor_type: deterministic
  executor_ref: epistemic_foundry.retrieval.planning:compile_query_plan
  input_schema_ref: schemas/node-invocation.schema.json
  output_schema_ref: schemas/query-plan.schema.json
  depends_on:
  - validate_insight_readiness
  read_scope:
  - db.insights
  - db.epistemic_work_classifications
  - domain_packs/**
  - config/retrieval_policy.example.yaml
  write_scope:
  - db.query_plans
  capabilities:
  - database_read
  - filesystem_read
  - database_write
  model_tier: deterministic
  timeout_seconds: 900
  max_attempts: 1
  failure_policy: fail_run
  acceptance_checks:
  - immutable request and classification revision/hash binding present
  - exact E0-E5 class floor applied
  - all eleven lane decisions use canonical order
  - optional selection never removes a floor lane
  - plan_hash matches deterministic canonical JSON
  resource_dependencies: []
  determinism_class: deterministic
  idempotency_key_fields:
  - request_id
  - request_revision
  - request_input_hash
  - classification_id
  - classification_revision
  - classification_hash
