workflow_id: evidence_retrieval
version: 4.0.0
kind: dag
description: Compile a relation-aware query plan, execute eleven evidence lanes, and
  issue a completeness-bounded EvidencePack.
input_schema_ref: schemas/node-invocation.schema.json
output_schema_ref: schemas/result-envelope.schema.json
canonical_runtime: Foundry Kernel
state_authority: Noetic Ledger
invariants:
- vector similarity is never the sole retrieval channel
- support, counter, null, boundary, method, temporal, and novelty searches are independently
  receipted
- searched-none is distinct from unsearched
- absence and novelty claims are bounded by recorded search scope
- dependent evidence is deduplicated before ranking or counting
terminal_states:
- PASS
- PARTIAL
- BLOCKED
- SPEC_GAP
- FAIL
completeness_contract:
  expected_node_count_source: compiled_run_spec
  missing_node_policy: FAIL
  partial_result_policy: typed_and_visible_only
nodes:
- node_id: validate_insight_readiness
  purpose: Validate statement, scope, mechanism, predictions, and falsifiers before
    retrieval
  executor_type: policy
  executor_ref: epistemic_foundry.policy.insights:validate_for_retrieval
  input_schema_ref: schemas/node-invocation.schema.json
  output_schema_ref: schemas/result-envelope.schema.json
  depends_on: []
  read_scope:
  - db.insights
  write_scope:
  - db.gate_decisions/insight_readiness
  capabilities:
  - database_read
  - database_write
  model_tier: deterministic
  timeout_seconds: 900
  max_attempts: 1
  failure_policy: fail_run
  acceptance_checks:
  - falsifier present or routed to Inbox
  - ambiguous terms listed
  - registration hash verified
  resource_dependencies: []
  determinism_class: deterministic
  idempotency_key_fields:
  - run_id
  - node_id
  - input_hash
  loop_contract_ref: null
  expected_effects:
  - insight_readiness_decision_created
  required_policy_checks:
  - policy_bundle_valid
  - capability_scope_valid
- node_id: compile_query_plan
  purpose: Compile directional, scoped, relation-aware queries and lane quotas
  executor_type: llm
  executor_ref: prompts/retrieval_planner.md
  input_schema_ref: schemas/node-invocation.schema.json
  output_schema_ref: schemas/result-envelope.schema.json
  depends_on:
  - validate_insight_readiness
  read_scope:
  - db.insights
  - domain_packs/**
  - config/retrieval_policy.example.yaml
  write_scope:
  - db.query_plans
  capabilities:
  - database_read
  - filesystem_read
  - database_write
  - llm_inference
  model_tier: frontier
  timeout_seconds: 900
  max_attempts: 2
  failure_policy: fail_run
  acceptance_checks:
  - forward and reverse relations explicit
  - scope expansions bounded
  - lane-specific stop criteria present
  resource_dependencies: []
  determinism_class: provider_nondeterministic
  idempotency_key_fields:
  - run_id
  - node_id
  - input_hash
  loop_contract_ref: null
  expected_effects:
  - query_plan_created
  required_policy_checks:
  - policy_bundle_valid
  - capability_scope_valid
