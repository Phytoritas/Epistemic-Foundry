    retrieval
  executor_type: policy
  executor_ref: epistemic_foundry.policy.insights:validate_for_retrieval
  input_schema_ref: schemas/node-invocation.schema.json
  output_schema_ref: schemas/result-envelope.schema.json
  depends_on: []
  read_scope:
  - db.insights
  write_scope:
  - db.gate_decisions/insight_readiness
  capabilities:
  - database_read
  - database_write
  model_tier: deterministic
  timeout_seconds: 900
  max_attempts: 1
  failure_policy: fail_run
  acceptance_checks:
  - falsifier present or routed to Inbox
  - ambiguous terms listed
  - registration hash verified
  resource_dependencies: []
  determinism_class: deterministic
  idempotency_key_fields:
  - run_id
  - node_id
  - input_hash
  loop_contract_ref: null
  expected_effects:
  - insight_readiness_decision_created
  required_policy_checks:
  - policy_bundle_valid
  - capability_scope_valid
- node_id: compile_query_plan
