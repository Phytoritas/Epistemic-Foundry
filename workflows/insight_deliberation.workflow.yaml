workflow_id: insight_deliberation
version: 4.0.0
kind: dag
description: Run asymmetric evidence deliberation, adversarial challenge, stability
  analysis, attestation, and Passport issuance.
input_schema_ref: schemas/node-invocation.schema.json
output_schema_ref: schemas/result-envelope.schema.json
canonical_runtime: Foundry Kernel
state_authority: Noetic Ledger
invariants:
- first-round briefs are blind and evidence-access asymmetric
- every substantive statement cites an Evidence or Argument ID or is marked unsupported
- method veto and deterministic gates cannot be overruled by majority vote
- minority reports and strongest counterevidence survive promotion
- epistemic, causal, novelty, validation, and promotion states remain separate
terminal_states:
- PASS
- PARTIAL
- BLOCKED
- SPEC_GAP
- FAIL
completeness_contract:
  expected_node_count_source: compiled_run_spec
  missing_node_policy: FAIL
  partial_result_policy: typed_and_visible_only
nodes:
- node_id: validate_insight_card
  purpose: Validate immutable InsightCard registration and route non-falsifiable cards
    to Inbox
  executor_type: policy
  executor_ref: epistemic_foundry.policy.insights:validate_for_council
  input_schema_ref: schemas/node-invocation.schema.json
  output_schema_ref: schemas/result-envelope.schema.json
  depends_on: []
  read_scope:
  - db.insights
  write_scope:
  - db.gate_decisions/council_readiness
  capabilities:
  - database_read
  - database_write
  model_tier: deterministic
  timeout_seconds: 900
  max_attempts: 1
  failure_policy: fail_run
  acceptance_checks:
  - statement/scope/mechanism/predictions/falsifiers present
  - revision hash verified
  - risk class assigned
  resource_dependencies: []
  determinism_class: deterministic
  idempotency_key_fields:
  - run_id
  - node_id
  - input_hash
  loop_contract_ref: null
  expected_effects:
  - council_readiness_decision_created
  required_policy_checks:
  - policy_bundle_valid
  - capability_scope_valid
- node_id: decompose_hypothesis
  purpose: Decompose the insight into atomic predictions, premises, assumptions, alternatives,
    and falsifiers
  executor_type: llm
  executor_ref: prompts/hypothesis_decomposer.md
  input_schema_ref: schemas/node-invocation.schema.json
  output_schema_ref: schemas/result-envelope.schema.json
  depends_on:
  - validate_insight_card
  read_scope:
  - db.insights
  write_scope:
  - db.hypothesis_decompositions
  capabilities:
  - database_read
  - database_write
  - llm_inference
  model_tier: frontier
  timeout_seconds: 900
  max_attempts: 2
  failure_policy: fail_run
  acceptance_checks:
  - scope not broadened
  - hidden assumptions explicit
  - predictions are discriminable
  resource_dependencies: []
  determinism_class: provider_nondeterministic
  idempotency_key_fields:
  - run_id
  - node_id
  - input_hash
  loop_contract_ref: null
  expected_effects:
  - hypothesis_decomposition_created
  required_policy_checks:
  - policy_bundle_valid
  - capability_scope_valid
- node_id: dispatch_evidence_retrieval
  purpose: Execute the canonical evidence retrieval subworkflow against the decomposition
  executor_type: subworkflow
  executor_ref: workflows/evidence_retrieval.workflow.yaml
  input_schema_ref: schemas/node-invocation.schema.json
  output_schema_ref: schemas/result-envelope.schema.json
  depends_on:
