  capabilities:
  - artifact_read
  - artifact_write
  model_tier: deterministic
  timeout_seconds: 1200
  max_attempts: 2
  failure_policy: fail_run
  acceptance_checks:
  - compute_reassessment_scope contract valid
  - compute_reassessment_scope result receipt present
  resource_dependencies: []
  determinism_class: deterministic
  idempotency_key_fields:
  - run_id
  - node_id
  - input_hash
  loop_contract_ref: null
  expected_effects:
  - compute_reassessment_scope_completed
  required_policy_checks:
  - policy_bundle_valid
  - capability_scope_valid
- node_id: schedule_optional_reassessment
  purpose: Schedule explicit new runs with new evaluator version
  executor_type: deterministic
  executor_ref: epistemic_foundry.evolution.schedule_optional_reassessment:run
  input_schema_ref: schemas/node-invocation.schema.json
