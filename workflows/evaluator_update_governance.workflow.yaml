- node_id: close_evaluator_update_proposal
  purpose: Close proposal with approvals, qualification and migration receipts
  executor_type: deterministic
  executor_ref: epistemic_foundry.evolution.close_evaluator_update_proposal:run
  input_schema_ref: schemas/node-invocation.schema.json
