  required_policy_checks:
  - policy_bundle_valid
  - capability_scope_valid
- node_id: compute_reassessment_scope
  purpose: Identify prior artifacts eligible for optional reassessment, never silent
    rewrite
  executor_type: deterministic
  executor_ref: epistemic_foundry.evolution.compute_reassessment_scope:run
  input_schema_ref: schemas/node-invocation.schema.json
  output_schema_ref: schemas/update-impact-report.schema.json
  depends_on:
