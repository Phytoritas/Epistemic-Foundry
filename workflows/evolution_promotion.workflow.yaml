workflow_id: evolution_promotion
version: 4.0.0
kind: dag
description: 'Execute the receipt-bound A05 promotion chain: deterministic G00-G10, sealed
  Evidence Parliament, G11, independent attestation, G12, ceiling recheck, G13 approval, bounded
  promotion:commit lease, and atomic G14.'
input_schema_ref: schemas/node-invocation.schema.json
output_schema_ref: schemas/result-envelope.schema.json
canonical_runtime: Foundry Kernel
state_authority: Noetic Ledger
invariants:
- no scalar score, majority vote, or model confidence can promote
- evaluator, holdout, policy, and prior revisions stay immutable
- llm nodes emit advisory adjudication or attestation only
- exactly one node holds promotion:commit
- every gate emits one immutable GateDecision in canonical order
terminal_states:
- PASS
- CONDITIONAL
- PARTIAL
- BLOCKED
- SPEC_GAP
- FAIL
completeness_contract:
  expected_node_count_source: compiled_run_spec
  missing_node_policy: FAIL
  partial_result_policy: typed_and_visible_only
nodes:
- node_id: record_promotion_request_intent
  purpose: Record ActionIntent(request_promotion) and seal the requested level and candidate
    revision
  executor_type: deterministic
  executor_ref: epistemic_foundry.governance.evolution_authority.nodes:record_promotion_request_intent
  input_schema_ref: schemas/node-invocation.schema.json
  output_schema_ref: schemas/action-intent.schema.json
  depends_on: []
  read_scope:
  - artifacts/evolution/promotion/**
  write_scope:
  - artifacts/evolution/promotion/record_promotion_request_intent/**
  capabilities:
  - artifact_read
  - artifact_write
  model_tier: deterministic
  timeout_seconds: 900
  max_attempts: 2
  failure_policy: fail_run
  acceptance_checks:
  - record_promotion_request_intent contract valid
  - requested level and candidate revision sealed before gating
  resource_dependencies: []
  determinism_class: deterministic
  idempotency_key_fields:
  - run_id
  - node_id
  - input_hash
  loop_contract_ref: null
  expected_effects:
  - record_promotion_request_intent_completed
  required_policy_checks:
  - policy_bundle_valid
  - capability_scope_valid
- node_id: build_promotion_pack
