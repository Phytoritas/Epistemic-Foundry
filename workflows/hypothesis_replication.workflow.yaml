  - artifact_write
  - llm_inference
  model_tier: frontier
  timeout_seconds: 1200
  max_attempts: 2
  failure_policy: fail_run
  acceptance_checks:
  - independent_replication_attestation contract valid
  - independent_replication_attestation result receipt present
  resource_dependencies: []
  determinism_class: provider_nondeterministic
  idempotency_key_fields:
  - run_id
  - node_id
  - input_hash
  loop_contract_ref: null
  expected_effects:
  - independent_replication_attestation_completed
  required_policy_checks:
  - policy_bundle_valid
  - capability_scope_valid
- node_id: compute_replication_promotion_effect
  purpose: Set RAISE, UNCHANGED, LOWER or BLOCK effect without rewriting original
    result
  executor_type: policy
  executor_ref: epistemic_foundry.evolution.compute_replication_promotion_effect:run
  input_schema_ref: schemas/node-invocation.schema.json
  output_schema_ref: schemas/replication-result.schema.json
  depends_on:
  - independent_replication_attestation
  read_scope: []
  write_scope:
  - db.replication_results
  capabilities:
  - artifact_read
  - artifact_write
  model_tier: deterministic
  timeout_seconds: 1200
  max_attempts: 2
  failure_policy: fail_run
  acceptance_checks:
  - compute_replication_promotion_effect contract valid
  - compute_replication_promotion_effect result receipt present
  resource_dependencies: []
  determinism_class: deterministic
  idempotency_key_fields:
  - run_id
  - node_id
  - input_hash
  loop_contract_ref: null
  expected_effects:
