  required_policy_checks:
  - policy_bundle_valid
  - capability_scope_valid
- node_id: invalidate_dependent_promotions_if_needed
  purpose: Propagate failed replication to dependent Passports and archive entries
  executor_type: policy
  executor_ref: epistemic_foundry.evolution.invalidate_dependent_promotions_if_needed:run
  input_schema_ref: schemas/node-invocation.schema.json
