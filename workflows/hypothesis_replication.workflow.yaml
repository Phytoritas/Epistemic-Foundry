  capabilities:
  - artifact_read
  - artifact_write
  model_tier: deterministic
  timeout_seconds: 1200
  max_attempts: 2
  failure_policy: fail_run
  acceptance_checks:
  - invalidate_dependent_promotions_if_needed contract valid
  - invalidate_dependent_promotions_if_needed result receipt present
  resource_dependencies: []
  determinism_class: deterministic
  idempotency_key_fields:
  - run_id
  - node_id
  - input_hash
  loop_contract_ref: null
  expected_effects:
  - invalidate_dependent_promotions_if_needed_completed
  required_policy_checks:
  - policy_bundle_valid
  - capability_scope_valid
