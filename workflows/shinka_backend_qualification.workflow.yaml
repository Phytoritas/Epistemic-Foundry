workflow_id: shinka_backend_qualification
version: 4.0.0
kind: dag
description: Qualify ShinkaEvolve as an optional executable-program search backend
  behind Foundry authority.
input_schema_ref: schemas/node-invocation.schema.json
output_schema_ref: schemas/result-envelope.schema.json
canonical_runtime: Foundry Kernel
state_authority: Noetic Ledger
invariants:
- external backend is optional and never canonical authority
- exact source revision and license are recorded
- raw combined score, archive or novelty labels cannot promote scientific claims
- candidate and evaluator/holdout trust domains remain separated
terminal_states:
- PASS
- PARTIAL
- BLOCKED
- SPEC_GAP
- FAIL
completeness_contract:
  expected_node_count_source: compiled_run_spec
  missing_node_policy: FAIL
  partial_result_policy: typed_and_visible_only
nodes:
- node_id: resolve_shinka_source_revision
  purpose: Resolve exact repository revision or package digest and Apache-2.0 license
  executor_type: retrieval
  executor_ref: epistemic_foundry.evolution.resolve_shinka_source_revision:run
  input_schema_ref: schemas/node-invocation.schema.json
  output_schema_ref: schemas/shinka-backend-manifest.schema.json
  depends_on: []
  read_scope: []
  write_scope:
  - artifacts/shinka/source/**
  capabilities:
  - network_read
  - artifact_write
  model_tier: balanced
  timeout_seconds: 1200
  max_attempts: 2
  failure_policy: fail_run
  acceptance_checks:
  - resolve_shinka_source_revision contract valid
  - resolve_shinka_source_revision result receipt present
  resource_dependencies: []
  determinism_class: seeded_nondeterministic
  idempotency_key_fields:
  - run_id
  - node_id
  - input_hash
  loop_contract_ref: null
  expected_effects:
  - resolve_shinka_source_revision_completed
  required_policy_checks:
  - policy_bundle_valid
  - capability_scope_valid
- node_id: inventory_shinka_runtime_surfaces
  purpose: Inventory runner, config, database, parent selection, novelty, bandit,
    prompts, skills and execution modes
  executor_type: deterministic
  executor_ref: epistemic_foundry.evolution.inventory_shinka_runtime_surfaces:run
  input_schema_ref: schemas/node-invocation.schema.json
  output_schema_ref: schemas/workspace-map-snapshot.schema.json
  depends_on:
  - resolve_shinka_source_revision
  read_scope: []
  write_scope:
  - artifacts/shinka/inventory/**
  capabilities:
  - artifact_read
  - artifact_write
  model_tier: deterministic
  timeout_seconds: 1200
  max_attempts: 2
  failure_policy: fail_run
  acceptance_checks:
  - inventory_shinka_runtime_surfaces contract valid
  - inventory_shinka_runtime_surfaces result receipt present
  resource_dependencies: []
  determinism_class: deterministic
  idempotency_key_fields:
  - run_id
  - node_id
  - input_hash
  loop_contract_ref: null
  expected_effects:
  - inventory_shinka_runtime_surfaces_completed
  required_policy_checks:
  - policy_bundle_valid
  - capability_scope_valid
- node_id: map_shinka_candidate_contract
  purpose: Map Program, metrics, correctness, archive and lineage to Foundry candidate
    and receipt contracts
  executor_type: deterministic
  executor_ref: epistemic_foundry.evolution.map_shinka_candidate_contract:run
  input_schema_ref: schemas/node-invocation.schema.json
  output_schema_ref: schemas/compatibility-matrix.schema.json
  depends_on:
  - inventory_shinka_runtime_surfaces
  read_scope: []
  write_scope:
  - artifacts/shinka/mapping/**
  capabilities:
  - artifact_read
  - artifact_write
  model_tier: deterministic
  timeout_seconds: 1200
  max_attempts: 2
  failure_policy: fail_run
  acceptance_checks:
  - map_shinka_candidate_contract contract valid
  - map_shinka_candidate_contract result receipt present
  resource_dependencies: []
  determinism_class: deterministic
  idempotency_key_fields:
  - run_id
  - node_id
  - input_hash
  loop_contract_ref: null
  expected_effects:
  - map_shinka_candidate_contract_completed
  required_policy_checks:
  - policy_bundle_valid
  - capability_scope_valid
- node_id: disable_unsafe_or_unqualified_features
  purpose: Disable direct evaluator mutation, unsealed prompt coevolution, hidden-holdout
    access and unsupported execution modes
  executor_type: policy
  executor_ref: epistemic_foundry.evolution.disable_unsafe_or_unqualified_features:run
  input_schema_ref: schemas/node-invocation.schema.json
  output_schema_ref: schemas/shinka-backend-manifest.schema.json
  depends_on:
  - map_shinka_candidate_contract
  read_scope: []
  write_scope:
  - artifacts/shinka/policy_overlay/**
  capabilities:
  - artifact_read
  - artifact_write
  model_tier: deterministic
  timeout_seconds: 1200
  max_attempts: 2
  failure_policy: fail_run
  acceptance_checks:
  - disable_unsafe_or_unqualified_features contract valid
  - disable_unsafe_or_unqualified_features result receipt present
  resource_dependencies: []
  determinism_class: deterministic
  idempotency_key_fields:
  - run_id
  - node_id
  - input_hash
  loop_contract_ref: null
  expected_effects:
  - disable_unsafe_or_unqualified_features_completed
  required_policy_checks:
  - policy_bundle_valid
  - capability_scope_valid
