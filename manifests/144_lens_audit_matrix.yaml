  - id: B08
    name: Artifact manifest
    question: Are derived files independently hashed and typed?
    approach: artifact provenance audit
    expected_status: PASS
    checks:
    - type: json_has_properties
      path: schemas/artifact-manifest.schema.json
      properties:
