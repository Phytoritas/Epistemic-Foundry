version: 2.0.0
architecture_name: Epistemic Foundry
audit_method:
  lens_count: 144
  family_count: 12
  execution: concurrent deterministic specification checks
  clarification: These are 144 independent review lenses and test questions, not 144 claims of independent human or model
    proof.
  status_semantics:
    PASS: all specification evidence checks passed
    CONDITIONAL: architecture is specified but a deployment-specific external decision remains
    FAIL: required design evidence is absent or inconsistent
families:
- id: A
  name: Epistemic semantics and type safety
  lenses:
  - id: A01
    name: Claim-first atom
    question: Is the reasoning atom a claim rather than an entire paper?
    approach: ontology/epistemology audit
    expected_status: PASS
    checks:
    - type: contains_all
      path: manifests/requirements_traceability.yaml
      tokens:
      - Claim-first
    - type: json_has_properties
      path: schemas/claim-card.schema.json
      properties:
      - claim_id
      - subject
      - relation
      - object
  - id: A02
    name: Span-or-reject
    question: Can a promoted claim exist without an immutable source anchor?
    approach: grounding invariant audit
    expected_status: PASS
    checks:
    - type: contains_all
      path: manifests/requirements_traceability.yaml
      tokens:
      - Span-or-reject
    - type: json_has_properties
      path: schemas/source-span.schema.json
      properties:
      - span_id
      - text_hash
      - provenance_manifest_id
  - id: A03
    name: Scope-first semantics
    question: Are scope and comparison conditions first-class before contradiction?
    approach: scope logic audit
    expected_status: PASS
    checks:
    - type: json_has_properties
      path: schemas/scope-vector.schema.json
      properties:
      - unit_of_analysis
      - temporal_scale
      - intervention_or_exposure
      - comparator
    - type: contains_all
      path: manifests/requirements_traceability.yaml
      tokens:
      - Scope-first
  - id: A04
    name: Falsifier admission gate
    question: Is a falsifier required before deliberation?
    approach: Popperian admission audit
    expected_status: PASS
    checks:
    - type: json_has_properties
      path: schemas/insight-card.schema.json
      properties:
      - falsifiers
      - predictions
    - type: contains_all
      path: manifests/requirements_traceability.yaml
      tokens:
      - Falsifier-before-council
  - id: A05
    name: Multidimensional verdict
    question: Are epistemic, causal, novelty, and promotion states separate?
    approach: type-system audit
    expected_status: PASS
    checks:
    - type: json_has_properties
      path: schemas/hypothesis-passport.schema.json
      properties:
      - epistemic_status
      - causal_status
      - novelty_status
      - promotion_level
      - epistemic_assessment
  - id: A06
    name: Causal ceiling
    question: Can association be promoted as identified causation?
    approach: causal semantics audit
    expected_status: PASS
    checks:
    - type: contains_all
      path: manifests/acceptance_matrix.yaml
      tokens:
      - No causal claim promoted
    - type: json_has_properties
      path: schemas/hypothesis-passport.schema.json
      properties:
      - causal_status
  - id: A07
    name: Evidence-class preservation
    question: Are observed, computed, simulated, formal, and benchmark results kept distinct?
    approach: evidence typing audit
    expected_status: PASS
    checks:
    - type: json_has_properties
      path: schemas/experiment-result.schema.json
      properties:
      - result_type
      - evidence_class
    - type: contains_all
      path: manifests/requirements_traceability.yaml
      tokens:
      - Evidence subtype preservation
  - id: A08
    name: Abstention as valid state
    question: Can the system return underdetermined or untestable instead of fabricating certainty?
    approach: abstention-state audit
    expected_status: PASS
    checks:
    - type: contains_all
      path: MASTER_SPEC.md
      tokens:
      - UNDERDETERMINED
      - UNTESTABLE
    - type: contains_all
      path: prompts/judge.md
      tokens:
      - Common execution contract
  - id: A09
    name: No proof inflation
    question: Does the architecture avoid treating literature support as universal proof?
    approach: language and claim-strength audit
    expected_status: PASS
    checks:
    - type: contains_all
      path: MASTER_SPEC.md
      tokens:
      - SUPPORTED
      - NOT_IDENTIFIED
    - type: contains_all
      path: manifests/acceptance_matrix.yaml
      tokens:
      - No simulated, computed, formal, or benchmark result
  - id: A10
    name: Boundary-condition representation
    question: Can findings be narrowed by condition rather than mislabeled as contradiction?
    approach: boundary semantics audit
    expected_status: PASS
    checks:
    - type: json_has_properties
      path: schemas/coverage-snapshot.schema.json
      properties:
      - cells
    - type: contains_all
      path: MASTER_SPEC.md
      tokens:
      - BOUNDARY_CONDITION
  - id: A11
    name: Argument/proposition separation
    question: Are arguments, assumptions, and evidence represented as different node types?
    approach: argumentation ontology audit
    expected_status: PASS
    checks:
    - type: json_has_properties
      path: schemas/argument-graph.schema.json
      properties:
      - nodes
      - edges
      - hidden_assumption_ids
      - unresolved_objection_ids
  - id: A12
    name: Hypothesis lifecycle
    question: Can a Passport become stale or superseded without historical erasure?
    approach: epistemic lifecycle audit
    expected_status: PASS
    checks:
    - type: json_has_properties
      path: schemas/hypothesis-passport.schema.json
      properties:
      - revision
      - lifecycle_status
      - stale_reasons
    - type: contains_all
      path: manifests/requirements_traceability.yaml
      tokens:
      - Lifecycle-not-overwrite
