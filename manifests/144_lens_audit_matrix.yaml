  - id: B09
    name: Append-only event record
    question: Can state transitions be reconstructed from immutable events?
    approach: event-sourcing audit
    expected_status: PASS
    checks:
    - type: json_has_properties
      path: schemas/event-record.schema.json
      properties:
      - event_id
      - sequence
      - event_type
      - event_hash
  - id: B10
    name: Context assembly provenance
    question: Is the exact evidence/context given to each agent reproducible?
    approach: context provenance audit
    expected_status: PASS
    checks:
    - type: json_has_properties
      path: schemas/context-assembly-manifest.schema.json
      properties:
      - evidence_ids
      - excluded_evidence_ids
      - context_hash
      - ordering_strategy
      - model_identifier
  - id: B11
    name: Noetic Ledger authority
    question: Is canonical state outside model conversation and tied to the ledger?
    approach: authority-boundary audit
    expected_status: PASS
    checks:
    - type: contains_all
      path: workflows/corpus_ingest.workflow.yaml
      tokens:
      - Noetic Ledger
    - type: contains_all
      path: manifests/requirements_traceability.yaml
      tokens:
      - Canonical state outside models
  - id: B12
    name: Production corpus license inventory
    question: Have concrete production corpus rights and access rules been assigned?
    approach: legal/deployment readiness audit
    expected_status: CONDITIONAL
    checks:
    - type: conditional
      path: manifests/acceptance_matrix.yaml
      condition: corpus licensing and access inventory
