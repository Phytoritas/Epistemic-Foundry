version: 4.0.0
roles:
- role_id: evidence_scout
  mission: Retrieve balanced relevant evidence and search receipts; no verdict.
  forbidden:
  - invent evidence
  - change canonical state directly
  - self-approve
  - expand scope without record
  model_tier: balanced
  codex_agent_type: explorer
  claude_agent_name: ef-evidence-scout
  tool_acl:
  - search.read
  - artifact.read
  evidence_acl:
  - support
  - counter
  - 'null'
  - boundary
  - method
  write_scope: []
  output_schema_ref: schemas/result-envelope.schema.json
  independent_review_required: false
  default_timeout_seconds: 1200
