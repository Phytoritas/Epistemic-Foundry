  - conflict handling returns SPEC_GAP
  required_checks:
  - instructions_lint
  - status_claim_audit
  initial_status: NOT_STARTED
  risk_class: critical
  owner_role: bounded_maker
  review_role: contract_reviewer
  stop_conditions:
