manifest_id: EF-DEV-4.0.0
authority_order:
- MASTER_SPEC.md
- manifests/development_manifest.yaml
- manifests/acceptance_matrix.yaml
- schemas/*.schema.json
- workflows/*.workflow.yaml
- AGENTS.md or CLAUDE.md
- work-package-local notes
execution_policy:
  default_mode: serial_by_dependency_with_bounded_parallel_branches
  parallelism: only dependency-ready packages with disjoint writes, frozen shared contracts, independent tests, and no shared exclusive resource
  author_may_self_approve: false
  allowed_terminal_statuses:
  - PASS
  - FAIL
  - BLOCKED
  - SPEC_GAP
  evidence_rule: No implementation, test, migration, install, security, novelty, or completion claim without a resolving artifact or effect receipt.
  canonical_cli: efoundry
  default_write_concurrency: 4
  default_read_concurrency: 8
  hard_agent_cap: 16
  hidden_edge_rule: shared writes, mutable contracts, quotas, approvals, credentials, privacy boundaries, migrations, and exclusive resources are dependencies
  checkpoint_rule: v3 foundation uses x04 checkpoints; v4 evolution integration uses x06 checkpoints. Only independently reviewed integration packages are safe resume points.
  budget_rule: budget enforcement must be labeled HARD_METERED, HARD_PREALLOCATED, SOFT_ESTIMATE, or UNMETERED
  plugin_rule: host hooks and chat state are adapters; Foundry Kernel and Noetic Ledger own authority
  evolution_authority_rule: Candidate, prompt, challenge and experiment evolution may not mutate Foundry authority, current evaluator, hidden holdout, policy, promotion gates or prior ledger history.
  evolution_fitness_rule: Scalar scores may guide search only. Promotion requires hard gates, FitnessVector receipts, statistics, replication and Parliament.
  hidden_holdout_rule: Candidate-generating roles and external search backends have no hidden-holdout read capability.
  candidate_reconciliation_rule: Every proposal fan-out reconciles expected, generated, evaluated, persisted, failed, cancelled and missing identities.
