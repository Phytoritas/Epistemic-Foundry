- attempt_id: T04-0001
  package: T04
  establishes: tools, MCP, CLI and sandbox gate
- attempt_id: U04-0001
  package: U04
  establishes: Foundry Console and API surface
- attempt_id: V04-0001
  package: V04
  establishes: Validation Bay execution surface
- attempt_id: W04-0001
  package: W04
  establishes: workflow, checkpoint and reassessment surface
- attempt_id: X04-0001
  package: X04
  establishes: X-phase cross-provider parity gate sealing the codex (X01) and claude-code (X02) host adapters
- attempt_id: Y04-0001
  package: Y04
  establishes: yield, operations and scale surface
citation_policy:
  rule: Every declared host row MUST cite at least one sealed_dependencies attempt through establishing_evidence; an uncited row is
    refused fail-closed and none of its host/OS cells may install. This rule applies to the host capability vocabulary under the
    top-level capabilities key. Candidate runtime_capabilities are unqualified payload mechanisms and cannot satisfy or bypass a host
    capability citation.
  every_citation_must_be_a_sealed_dependency: true
  capabilities_without_a_citation_cannot_be_supported: true
  candidate_runtime_capabilities_are_not_host_capabilities: true
  refusal_codes:
    row_uncited: EF_Z01_ROW_UNCITED
    citation_not_sealed: EF_Z01_CITATION_NOT_SEALED
    capability_uncited: EF_Z01_CAP_UNCITED
