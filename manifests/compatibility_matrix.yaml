- windows-x64
- linux-x64
- macos-arm64
capabilities:
- manifest
- skills
- hooks
- mcp
- payload
- upgrade
- rollback
- uninstall
install:
  target_layout_template: '{host_home}/plugins/cache/{marketplace}/{plugin}'
  fresh_install_produces: byte-for-byte copy of the declared payload tree under the installed cache root, with no extra or missing
    files relative to the payload manifest set
  supported_requires:
  - cell_status_is_SUPPORTED
  - all_required_evidence_recorded
  - capability_has_at_least_one_sealed_citation
  refuse_when: the addressed host/capability cell status is not SUPPORTED, or any required_evidence item is not recorded for that cell,
    or the capability has no sealed establishing citation
  refusal_is_fail_closed: true
lifecycle:
  user_data_policy: preserve
  user_data_locations:
  - '{user_state_home}/epistemic-foundry/profile.sqlite3'
  - '{user_state_home}/epistemic-foundry/artifacts'
  - '{user_state_home}/epistemic-foundry/ledger'
  removable_state:
  - id: installed_cache
    location: '{host_home}/plugins/cache/{marketplace}/{plugin}'
  - id: installed_config_block
    location: '{host_config}/config.toml#[plugins."{plugin}@{marketplace}"]'
  - id: marketplace_config_block
    location: '{host_config}/config.toml#[marketplaces."{marketplace}"]'
  uninstall:
    removes:
    - installed_cache
    - installed_config_block
    - marketplace_config_block
    preserves_user_data: true
    partial_uninstall_is_failure: true
    orphan_residue_allowed: 0
    refuses_user_data_deletion: true
required_evidence:
- host_version
- platform_fingerprint
- clean_profile
- installation_command_and_exit
- capability_probe
- hook_event_coverage
- MCP_handshake
- state_roundtrip
- upgrade_and_rollback_log
- uninstall_residue_scan
- artifact_hashes
allowed_statuses:
- UNVERIFIED
- ADAPTER_REQUIRED
- SUPPORTED
- DEGRADED
- BLOCKED
- UNSUPPORTED
