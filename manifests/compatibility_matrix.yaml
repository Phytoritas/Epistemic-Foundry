version: 4.0.0
status: UNVERIFIED_REFERENCE_MATRIX
policy: No row may become SUPPORTED without recorded fresh-install, lifecycle-hook, MCP, payload, upgrade, rollback and uninstall
  evidence.
model_note: This is a fail-closed reference compatibility and lifecycle matrix. It declares the identity, payload layout, host/platform
  cells, the sealed-package provenance that establishes each host, and the install/uninstall lifecycle policy that a fresh install and
  uninstall must satisfy. Candidate runtime_capabilities describe mechanisms already present in the payload; they do not establish a
  verified host cell, PLUGIN_ALPHA qualification, validation, or production readiness. Every host cell remains UNVERIFIED or
  ADAPTER_REQUIRED and every install decision is REFUSED until the required evidence is recorded (see docs/216_lens_plugin_audit.md F05
  and MASTER_SPEC fresh-install/uninstall acceptance). The Z01 install-matrix and uninstall-data harnesses read this file as the single
  declaring source of the host and platform lists and never restate them.
plugin:
  name: epistemic-foundry
  version: 4.0.0
  runtime_capabilities:
  - installed_plugin_cli_execution
  - installed_plugin_mcp_execution
  - bundled_python_runtime_execution
  - runtime_payload_integrity_verification
  - workspace_path_confinement
  - degraded_runtime_diagnostics
  identity_source: plugins/epistemic-foundry/.codex-plugin/plugin.json
payload:
  root: plugins/epistemic-foundry
  manifest: .codex-plugin/plugin.json
  expected_top_level:
  - .codex-plugin
  - .mcp.json
  - assets
  - bin
  - dist
  - hooks
  - runtime
  - scripts
  - skills
  - src
