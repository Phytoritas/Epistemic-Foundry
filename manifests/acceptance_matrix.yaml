  PILOT_200:
    scope: 200-document, multi-domain pilot with external prior-art, independent replication,
      cross-provider and recovery evaluation.
    gates:
      gold_claim_span_validity: '>=0.95'
      external_prior_art_false_novelty_rate: <=0.05
