      independent_security_review: PASS
  PRODUCTION_2000:
    scope: 1,800–2,000-document production qualification with load, cost, security,
      backup/restore, license and operational SLO evidence.
    gates:
      licensed_corpus_coverage: '1.00'
      production_load_test: PASS
      p95_run_latency: deployment SLO met
      hard_budget_overrun_rate: '0'
