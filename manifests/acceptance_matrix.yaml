      audit_and_export_traceability: '1.00'
      signed_release_or_explicit_unsigned: PASS
      incident_drill: PASS
  CROSS_DOMAIN_QUALIFIED:
    scope: At least three materially different domains with independent DomainPacks,
      evaluators, gold sets and expert review.
    gates:
      qualified_domain_count: '>=3'
      core_schema_fork_count: '0'
      domainpack_isolation: PASS
      measurement_contract_accuracy: '>=0.95'
      domain_specific_false_promotion: each domain bound met
      cross_domain_regression: PASS
      independent_domain_expert_review: PASS
non_waivable_gates:
- current-run evaluator immutability
- candidate-hidden-holdout separation
- source/evidence provenance
- no self-approval
- no scalar promotion authority
- candidate/effect count reconciliation
- adaptive-search statistical accounting
- independent replication or explicit promotion ceiling
- protected negative-result memory
- truthful maturity and evidence-class labeling
conditional_external_values:
- production corpus license and access policy
- gold annotation and expert adjudication team
- first production DomainPack and ontology versions
- qualified evaluator and hidden/OOD data custodian
- statistical family/error-control policy by domain
- production sandbox/container/cluster topology
- PostgreSQL/object storage/queue/region and disaster-recovery SLOs
- provider credentials, rate limits, cancellation and hard metering
- ShinkaEvolve exact implementation-time revision/package digest
- production signing identity and key custody
- independent security and privacy review
- cross-platform Codex/Claude host capability matrix
- operator training and appeal authority
- ethics review thresholds for high-risk domains
- actual 2,000-document cost/latency/quality evidence
