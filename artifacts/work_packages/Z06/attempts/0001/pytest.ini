# Z06's terminal release composition surface ships under release/v4_z06 (outside
# the src package tree, so it is not part of the wheel and not collected by
# `pytest tests`), and its tests live in this attempt directory because the
# manifest write scope covers the release surface and this package only. This
# attempt directory, both release surfaces (v4_z06 composes v4_z05) and the src
# tree all go on the path.
[pytest]
testpaths = .
addopts = -q
pythonpath = . ../../../../../release ../../../../../src
