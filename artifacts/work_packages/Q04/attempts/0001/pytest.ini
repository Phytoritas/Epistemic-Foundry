# Q04's harnesses ship under evals/time_sliced and evals/adversarial because
# the manifest write scope covers those two directories and this package only,
# so both component roots go on the path beside this attempt directory.  src
# joins them so the emitted hashes can be checked against the canonical
# hashing module rather than only against themselves.
[pytest]
testpaths = .
addopts = -q
pythonpath = . ../../../../../src ../../../../../evals/time_sliced ../../../../../evals/adversarial
