# R06's crossover safety gate ships under
# src/epistemic_foundry/reasoning/v4_r06, and its tests live in this attempt
# directory because the manifest write scope covers the engine and this package
# only. Both roots go on the path: this directory for `fixtures`, and the source
# tree for `epistemic_foundry`.
[pytest]
testpaths = .
addopts = -q
pythonpath = . ../../../../../src
