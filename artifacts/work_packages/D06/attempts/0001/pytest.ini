# D06's migration and its tests live in the attempt directory (the manifest
# write scope is migrations/v4_d06/** plus this attempt), so the attempt root
# goes on the path.  D05's attempt root goes on it too: the container harness
# is imported from the package that owns it rather than copied here.  The
# suite drives a real PostgreSQL container; it is targeted only and never
# collected by the repository test path.
[pytest]
testpaths = .
addopts = -q
pythonpath = . ../../../D05/attempts/0001
