# U05's Evolution Chamber console ships under
# src/epistemic_foundry/console/v4_u05, and its tests live in this attempt
# directory because the manifest write scope covers that package and these
# artifacts only. Both roots go on the path: this directory for `fixtures`, and
# the source tree for `epistemic_foundry`.
[pytest]
testpaths = .
addopts = -q
pythonpath = . ../../../../../src
