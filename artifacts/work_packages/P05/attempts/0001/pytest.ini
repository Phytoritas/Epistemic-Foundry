# P05's evolution-promotion Parliament gate ships under
# src/epistemic_foundry/parliament/v4_p05, and its tests live in this attempt
# directory because the manifest write scope covers that package and this
# work-package directory only. Both roots go on the path: this directory for
# `fixtures`, and the source tree for `epistemic_foundry`.
[pytest]
testpaths = .
addopts = -q
pythonpath = . ../../../../../src
