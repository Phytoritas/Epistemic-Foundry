# V04 composes the sealed V01/V02/V03 components from sibling top-level
# component packages, which a relative import cannot cross, and reads the
# canonical vocabularies from schemas/ at the repository root.  Putting the
# component root on the path makes every absolute import resolve exactly as it
# does for a component consumer, and keeps this package outside the repository
# testpaths so the repository-wide collection is unchanged.
[pytest]
testpaths = .
addopts = -q
pythonpath = ../../..
