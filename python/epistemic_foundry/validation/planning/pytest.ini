# V02 composes the sealed V01 screen from a sibling top-level component
# package, which a relative import cannot cross, and reads the canonical
# vocabularies from schemas/ at the repository root.  Putting the component
# root on the path makes both absolute imports resolve exactly as they do for a
# component consumer, and keeps this package outside the repository testpaths
# so the repository-wide collection is unchanged.
[pytest]
testpaths = .
addopts = -q
pythonpath = ../../..
